name: Verificar

# Corre lint, tipos y pruebas en cada push y en cada pull request.
# Si algo se rompe, se entera GitHub antes que el cliente.
on:
  push:
    branches: [main, develop, rebanada-2-inventario]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      # ci instala exactamente lo que dice package-lock.json, sin resolver
      # versiones nuevas. Es lo que hace reproducible la compilacion.
      - run: npm ci

      - run: npm run security:secrets
      - run: npm run lint
      - run: npm run typecheck
      - name: Comprobar tipos de Edge Functions
        run: >-
          deno check --node-modules-dir=auto --no-lock
          supabase/functions/administration/index.ts
          supabase/functions/freelance-access/index.ts
          supabase/functions/prepare-production/index.ts
          supabase/functions/sync/index.ts
      - run: npm run test
      - run: npm run build

  supabase-e2e:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Construye una instancia desechable desde las migraciones del repositorio.
      # El runner de GitHub incluye Docker; no se conecta al proyecto remoto.
      - run: npx supabase start

      - name: Exponer credenciales de la instancia local
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "CREARCOS_E2E_SUPABASE_LOCAL=true"
          } >> "$GITHUB_ENV"

      - run: npx supabase test db
      - run: npm run test:e2e:sync

      - name: Detener Supabase local
        if: always()
        run: npx supabase stop --no-backup
