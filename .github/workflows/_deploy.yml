name: Desplegar entorno

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      cloudflare_branch:
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  desplegar:
    name: Verificar, migrar, desplegar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CREARCOS_DEPLOY_ENV: ${{ inputs.environment }}
      CREARCOS_COMMIT_SHA: ${{ github.sha }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ENABLE_LOCAL_DEMO: 'false'
      VITE_LOCAL_DEMO_PASSWORD: ''
      AUTH_REDIRECT_URL: ${{ vars.AUTH_REDIRECT_URL }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - run: npm ci

      - name: Validar variables y secretos requeridos
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run deployment:validate

      - run: npm run security:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Comprobar tipos de Edge Functions
        run: >-
          deno check --node-modules-dir=auto --no-lock
          supabase/functions/administration/index.ts
          supabase/functions/freelance-access/index.ts
          supabase/functions/prepare-production/index.ts
          supabase/functions/sync/index.ts

      - name: Verificar migraciones en una base desechable
        shell: bash
        run: |
          npx supabase start
          eval "$(npx supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "CREARCOS_E2E_SUPABASE_LOCAL=true"
          } >> "$GITHUB_ENV"
          npx supabase test db
          npm run test:e2e:sync
          npx supabase stop --no-backup

      - name: Enlazar proyecto y revisar migraciones remotas
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
          npx supabase db push --linked --dry-run

      - name: Aplicar migraciones pendientes sin seed
        run: npx supabase db push --linked --yes

      - name: Configurar origen y redirect exactos de Edge
        run: >-
          npx supabase secrets set
          ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
          AUTH_REDIRECT_URL="$AUTH_REDIRECT_URL"
          --project-ref "$SUPABASE_PROJECT_ID"

      - name: Desplegar Edge Functions
        run: npx supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Compilar artefacto inmutable
        run: npm run build

      - name: Conservar artefacto verificable
        uses: actions/upload-artifact@v7
        with:
          name: web-${{ inputs.environment }}-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 30

      - name: Desplegar Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy apps/web/dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ inputs.cloudflare_branch }}
            --commit-hash=${{ github.sha }}

      - name: Smoke remoto con reintentos de propagacion
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.PUBLIC_APP_URL }}
        run: |
          for intento in 1 2 3 4 5; do
            if npm run deployment:smoke; then exit 0; fi
            if [ "$intento" = 5 ]; then exit 1; fi
            sleep 10
          done

      - name: Resumen de despliegue
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.pages.outputs.pages-deployment-alias-url }}
        run: |
          echo "### Despliegue aprobado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Entorno: $CREARCOS_DEPLOY_ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $CREARCOS_COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Host validado: $PUBLIC_APP_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL inmutable: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alias: $ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Detener Supabase local ante fallos
        if: always()
        run: npx supabase stop --no-backup || true
